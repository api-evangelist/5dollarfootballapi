openapi: 3.2.0
info:
  title: 5DollarFootballAPI — Football Data Fixtures API
  version: 1.0.0
  summary: 'Football (soccer) data: live scores, fixtures, standings, corner and card statistics, and odds.'
  description: 'The 5DollarFootballAPI is a read-only REST API. Every response is JSON with a top-level "success" flag. All timestamps are UTC (ISO-8601). The base URL is https://api.5dollarfootballapi.com/v1.


    Authenticate every request with your API key in an Authorization header: `Authorization: Bearer fb_live_your_key`. You can also send it as `X-API-Key`. Get a key by creating a free account — no card required. Keys are shown once; store them securely and never embed them in public client-side code.


    Each plan has a per-minute rate window — short parallel bursts are fine as long as the minute total holds, and there are no daily caps or monthly pools. Every response includes `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` for the current window. When you exceed the limit you get HTTP 429 with a `Retry-After` header — back off and retry.


    List endpoints accept `page` (default 1) and `per_page` (default 50, max 100), and return a `pagination` object: `{ page, per_page, count, has_more }`. Keep requesting the next page while `has_more` is true. The underlying set can change between two page requests (a match kicks off or finishes); for the volatile live view, request `status=live` with a large `per_page` (up to 500) so a single page holds everything.


    Errors return `{ "success": 0, "error": { ... } }` with an HTTP status. The error object has a machine-readable `type` and `code`, a human `message`, an optional `param`, a `doc_url`, and a `request_id` to quote in support. We never return a silent `200` with empty data for a missing resource — you get a proper 404.'
  termsOfService: https://5dollarfootballapi.com/terms
  contact:
    name: 5DollarFootballAPI support
    url: https://5dollarfootballapi.com/contact
    email: contact@5dollarfootballapi.com
servers:
- url: https://api.5dollarfootballapi.com/v1
  description: Production
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: fixtures
  description: 'Matches: the daily window and per-fixture detail — events, statistics, odds and odds history.'
paths:
  /fixtures:
    get:
      operationId: fixtures
      summary: List fixtures
      description: 'The window view: fixtures and results for a time window of up to 24 hours (default: today UTC), or every in-play match with ?status=live. For a whole season or one team''s matches, see /v1/leagues/{id}/fixtures and /v1/teams/{id}/fixtures. Add ?include=odds,events,stats to expand every row in place — one call per screen, not one call per match. How far back you can query follows your plan: 3 months on Free, 12 months on Pro, back to 2014 on Ultra.'
      tags:
      - fixtures
      parameters:
      - name: start_time
        in: query
        required: false
        description: Window start as a unix timestamp (seconds, UTC), inclusive. Defaults to 00:00 UTC today; if only end_time is sent, defaults to 24h before it.
        schema:
          type: integer
      - name: end_time
        in: query
        required: false
        description: Window end as a unix timestamp (seconds, UTC), exclusive. Defaults to start_time + 24h. The window may span at most 24 hours — pick any day boundary in any timezone.
        schema:
          type: integer
      - name: league
        in: query
        required: false
        description: Filter by league id.
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: all | scheduled | live | finished. Defaults to all. "live" returns every in-play match right now, regardless of date.
        schema:
          type: string
      - name: include
        in: query
        required: false
        description: Comma list of odds | events | stats — expands each fixture with the Bet365 market lines (paid plans), the event timeline, and the in-play statistics, in the same shapes as the per-fixture endpoints. Caps per_page at 50.
        schema:
          type: string
      - name: esports
        in: query
        required: false
        description: true | false. Defaults to false (real football only); true returns esoccer (e-football) matches instead.
        schema:
          type: boolean
      - name: lang
        in: query
        required: false
        description: Localize team & league names (21 languages besides English, e.g. zh-cn, ja, es, de, pt). Missing translations fall back to English.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Pagination (per_page max 100; 50 with include; 500 with status=live, so one page holds every live match).
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Pagination (per_page max 100; 50 with include; 500 with status=live, so one page holds every live match).
        schema:
          type: integer
      responses:
        '200':
          description: Success
          headers:
            X-RateLimit-Limit:
              description: Requests allowed in the current window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: 1
                data:
                - id: 197590518
                  league:
                    id: 43659
                    name: USA USL Cup
                  teams:
                    home:
                      id: 51386
                      name: Birmingham Legion FC
                    away:
                      id: 58558
                      name: Tulsa
                  kickoff_utc: '2026-07-12T00:00:00+00:00'
                  kickoff_ts: 1783814400
