                    dangerous_attacks:
                      home: 11
                      away: 14
                    shots_on_target:
                      home: 3
                      away: 5
                    shots_off_target:
                      home: 4
                      away: 2
                    possession:
                      home: 51
                      away: 49
                    first_half:
                      attacks:
                        home: 15
