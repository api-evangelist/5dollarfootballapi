aid: 5dollarfootballapi
name: 5DollarFootballAPI
description: A read-only REST football (soccer) data API covering live scores, fixtures, standings, league
  and team surfaces, match events, and corner and card statistics, plus a bookmakers endpoint and a status
  check. Fifteen operations across seven tags, served from a single versioned host under bearer-token
  or API-key authentication. Positioned on price — the pitch is the same data from $5/month.
