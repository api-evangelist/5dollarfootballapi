aid: 5dollarfootballapi

image: https://5dollarfootballapi.com/logo.png

name: 5DollarFootballAPI

description: A read‑only REST football (soccer) data API offering comprehensive live scores, detailed fixtures, league standings, team and player
  statistics, match events, corner and card data, as well as bookmaker odds and a status endpoint. It provides fifteen operations across seven
  tags, hosted on a versioned API under bearer‑token or API‑key authentication, priced affordably at $5 per month for developers seeking reliable
  sports data.

