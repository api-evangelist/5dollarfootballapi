x-evidence:
  round: '2026-08-19'
  admitted_from: Add-API parked queue. Submitted TWICE — e9f4ce5d 04:48 UTC (confidence 8) and 9ebe84a1
    07:24 UTC (confidence 3), same slug, both parked no_consumable_surface.
  why_the_gate_was_wrong: 'Both dossiers state the domain was "unreachable on every request" with "zero
    web footprint". That was not true when checked at 2026-08-19 ~10:15 UTC: the homepage, all seven declared
    pointers, the apis.json, the llms.txt and a valid 169KB OpenAPI all return 200. The site was most
    likely not yet live when they submitted, and they resubmitted three hours later. The gate declined
    a real provider for a transient reason.'
  verified_2026_08_19:
    openapi.json: 200 application/json 169,269b — valid OpenAPI 3.1.0, 15 paths, 15 operations, 7 declared
      tags, securitySchemes bearerAuth + apiKeyHeader
    llms.txt: 200 text/plain 6,106b — real, not an HTML error page
    apis.json: 200 application/json 2,771b
    seven_declared_pointers: docs, openapi.json, pricing, signup, docs/changelog, terms, privacy — all
      200 with DISTINCT md5s and sizes, so not an SPA catch-all
    negative_control: https://5dollarfootballapi.com/zzz-not-real-9137 -> 404, so the 200s above are genuine
  defect_to_report: 'Their apis.json carries created: 2026-08-19 with modified: 2026-08-01 — modified
    precedes created. The gate flagged this correctly and it is worth telling them.'
  not_credited: api.5dollarfootballapi.com/v1 returns the website 404 page rather than an API root. Noted,
    not scored — a 404 on an API host root is normal.
